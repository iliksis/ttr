# fly.toml app configuration file generated for ttr-server on 2026-09-02T08:24:24+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ttr-server'
primary_region = 'fra'

[build]
[env]
  TTR_ADDR = ':8080'
  TTR_DB_PATH = '/data/ttr.db'

[[mounts]]
  source = 'ttr_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
