app = "ttr-server"
primary_region = "fra"

[build]

[env]
  TTR_DB_PATH = "/data/ttr.db"
  TTR_ADDR = ":8080"

[[mounts]]
  source = "ttr_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
